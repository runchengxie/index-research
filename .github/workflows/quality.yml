name: Index research quality

on:
  pull_request:
    paths:
      - "*.py"
      - "tests/**"
      - "web/**"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: astral-sh/setup-uv@v10
        with:
          version: latest
          python-version: "3.11"
          enable-cache: false

      - name: Test Python research scripts
        run: >-
          PYTHONPATH=. uv run --with pytest --with pandas --with pyarrow --with numpy
          --with duckdb --with tushare pytest -q tests

      - name: Check Python syntax
        run: >-
          python -m py_compile analyze.py fetch_linked_indices.py pair_and_rank.py
          build_microcap_reconstruction.py build_microcap_snapshot.py

      - name: Scan public files for local secrets and paths
        run: >-
          ! rg -n '/home/|/Users/|TUSHARE_TOKEN=|fast\\.xiaodefa\\.cn'
          site web/src web/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build web dashboard
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level high
